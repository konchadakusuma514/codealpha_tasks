<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        if (localStorage.getItem("theme") === "dark") { document.documentElement.classList.add("dark-mode"); }
    </script>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="text-center">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h2 class="mb-4">Oops! Book Not Found.</h2>
        <p class="lead mb-5 text-muted">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="btn btn-primary btn-lg px-5" style="border-radius: 30px;">Go Back Home</a>
    </div>

</body>
</html>
